<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indra Lab · Biokimia sistem indra</title>
<meta name="description" content="Platform belajar biokimia sistem indra: enam jalur sinyal dengan diagram 2D interaktif dan kuis yang dinilai otomatis.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='%23141714'/%3E%3Ccircle cx='12' cy='12' r='3.4' fill='%23f3f4ef'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Lewati ke isi</a>

<div class="shell">
  <aside class="side" aria-label="Navigasi utama">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" fill="none">
        <circle cx="12" cy="12" r="8.6" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="12" cy="12" r="3.2" fill="currentColor"/>
        <path d="M12 1.6v4.2M22.4 12h-4.2M12 22.4v-4.2M1.6 12h4.2" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <div class="brand-txt">
        <span class="brand-name">Indra Lab</span>
        <span class="brand-scope">Biokimia sistem indra</span>
      </div>
    </div>

    <nav class="nav" id="sideNav" aria-label="Ruang belajar"></nav>

    <div class="side-foot">
      <div class="side-progress">
        <span class="side-progress-lab">Jalur diuji</span>
        <span class="side-progress-val" id="sideProgress">0 / 6</span>
      </div>
      <p class="side-note">Materi kuliah Biokimia Sistem Indra · 6 jalur, 62 langkah.</p>
    </div>
  </aside>

  <div class="workspace">
    <header class="mobilebar">
      <a class="mobile-brand" href="#/">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" fill="none">
          <circle cx="12" cy="12" r="8.6" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="12" cy="12" r="3.2" fill="currentColor"/>
        </svg>
        Indra Lab
      </a>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="sheet">Menu</button>
    </header>

    <main id="main" class="main" tabindex="-1">
      <section class="view" id="view-home" aria-labelledby="homeTitle"></section>
      <section class="view" id="view-path" aria-label="Jalur sinyal" hidden></section>
      <section class="view" id="view-quiz" aria-label="Kuis" hidden></section>
      <section class="view" id="view-progress" aria-label="Kemajuan" hidden></section>
      <noscript><p class="noscript">Indra Lab memerlukan JavaScript untuk menjalankan diagram dan kuis. Aktifkan JavaScript lalu muat ulang halaman.</p></noscript>
    </main>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-top">
    <span class="sheet-title">Menu</span>
    <button class="menu-btn" id="sheetClose">Tutup</button>
  </div>
  <nav class="nav sheet-nav" id="sheetNav" aria-label="Menu telefon"></nav>
  <p class="side-note">Biokimia sistem indra · 6 jalur, 62 langkah.</p>
</div>

<div class="live" id="live" aria-live="polite" aria-atomic="true"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="data.js" defer></script>
<script src="scenes.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
